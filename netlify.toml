# Deploy en Netlify. Firebase se usa solo para Auth, Firestore y Storage (ver README).
# Las variables VITE_FIREBASE_* se cargan en Netlify (Project configuration > Environment variables).

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# SPA: cualquier ruta (p. ej. /presupuestos/abc al recargar) sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el HTML no se cachean, así las actualizaciones de la PWA llegan enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
